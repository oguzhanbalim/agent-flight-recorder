[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-flight-recorder"
version = "0.1.0"
description = "A black box for agents: record Messages API calls to JSONL, replay offline, diff two runs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Oğuzhan Balım" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "anthropic>=1,<2"]

[project.scripts]
flight-recorder = "flight_recorder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
